name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Docs lint tests
        run: sh scripts/test-check-docs.sh
      - name: Docs lint
        run: sh scripts/check-docs.sh
      - name: Workflow lint tests
        run: sh scripts/test-check-workflows.sh
      - name: Workflow lint
        run: sh scripts/check-workflows.sh
      - name: Formula renderer tests
        run: sh scripts/test-render-formula.sh
      - name: Release info tests
        run: sh scripts/test-release-info.sh

  swift-macos:
    runs-on: macos-15
    # A keychain or Touch ID dialog cannot be answered on a runner; fail rather than hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode 16.2 (Swift 6.0.x, the minimum the package declares)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.0'
      - name: Test
        run: swift test
      - name: The tests leave the tree as they found it (the release workflow requires it)
        run: |
          [ -z "$(git status --porcelain)" ] || { git status --short >&2; echo "the tests changed the working tree" >&2; exit 1; }
      - name: Release build, ad-hoc signature with the hardened runtime, doctor
        run: sh scripts/ci-signed-build.sh
      - name: Release script argument tests
        run: sh scripts/test-verify-release-binary.sh

  # The whole signing pipeline with a throw-away certificate, so that a broken script is found
  # in a pull request and not at the first tag. Nothing here is a release.
  release-dry-run:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Package, sign, verify with a throw-away certificate
        run: sh scripts/ci-release-dry-run.sh

  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
